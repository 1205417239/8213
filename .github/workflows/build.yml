name: Build LinguaTweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

      - name: Build arm64e
        run: |
          export THEOS="$HOME/theos"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          export PATH="$THEOS/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"

          echo "=== Check Theos ==="
          ls -l "$THEOS/makefiles/tweak.mk"
          ls -l "$THEOS/makefiles/aggregate.mk"

          echo "=== Check dm.pl ==="
          ls -l "$THEOS/bin/dm.pl"
          ls -l "$THEOS/vendor/dm.pl/dm.pl"

          echo "=== Build PreferenceBundle ==="
          cd LinguaTweakPrefs

          make package \
            ARCHS=arm64e \
            FINALPACKAGE=1

      - name: Find deb
        run: |
          find . -name "*.deb" -print

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e
          path: |
            LinguaTweakPrefs/packages/*.deb
            LinguaTweakPrefs/.theos/packages/*.deb
          if-no-files-found: error
