name: Build LinguaTweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

          echo "Available iPhoneOS SDKs:"
          ls -la "$HOME/theos/sdks" | grep iPhoneOS || true

          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build arm64e only
        env:
          THEOS: ${{ env.HOME }}/theos
        run: |
          export THEOS="$HOME/theos"
          export PATH="/opt/homebrew/bin:$PATH"

          echo "THEOS=$THEOS"
          echo "clang=$(which clang)"
          echo "ldid=$(which ldid)"

          make clean

          make package \
            ARCHS=arm64e \
            FINALPACKAGE=1

      - name: Verify build
        run: |
          echo "=== Debian packages ==="
          find . -name "*.deb" -print

          echo
          echo "=== Mach-O files ==="
          find .theos -type f \( -name "*.dylib" -o -name "*.bundle" \) -print 2>/dev/null || true

          echo
          echo "=== Architectures ==="
          find .theos -type f \( -name "*.dylib" -o -name "*.bundle" \) \
            -exec file {} \; 2>/dev/null || true

      - name: Collect package
        run: |
          mkdir -p artifacts
          find . -name "*.deb" -exec cp {} artifacts/ \;

          echo "=== Final artifacts ==="
          ls -lah artifacts

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e
          path: artifacts/*.deb
          if-no-files-found: error
