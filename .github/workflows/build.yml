name: Build LinguaTweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build arm64e
        run: |
          export THEOS="$HOME/theos"
          export THEOS_MAKE_PATH="$HOME/theos/makefiles"
          export PATH="$HOME/theos/bin:/opt/homebrew/bin:$PATH"

          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"

          ls "$THEOS_MAKE_PATH/tweak.mk"
          ls "$THEOS_MAKE_PATH/aggregate.mk"

          echo "Checking dm.pl..."

          if [ -x "$THEOS/bin/dm.pl" ]; then
            echo "Found: $THEOS/bin/dm.pl"
          elif [ -x "$THEOS/vendor/dm.pl/dm.pl" ]; then
            echo "Found: $THEOS/vendor/dm.pl/dm.pl"
            export PATH="$THEOS/vendor/dm.pl:$PATH"
          elif [ -x "$THEOS/bin/dm.py" ]; then
            echo "Found: $THEOS/bin/dm.py"
          else
            echo "ERROR: dm.pl was not found in Theos"
            find "$THEOS" -name "dm.pl" -o -name "dm.py"
            exit 1
          fi

          which dm.pl || true
          which dm.py || true

          cd LinguaTweakPrefs

          make package \
            ARCHS=arm64e \
            FINALPACKAGE=1

      - name: Find deb
        run: |
          find . -name "*.deb" -print

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e
          path: |
            packages/*.deb
            .theos/packages/*.deb
          if-no-files-found: error
