name: Build LinguaTweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build arm64e
        run: |
          export THEOS="$HOME/theos"
          export THEOS_MAKE_PATH="$THEOS/makefiles"
          export PATH="$THEOS/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"

          ls -l "$THEOS/makefiles/tweak.mk"
          ls -l "$THEOS/makefiles/aggregate.mk"

          echo "=== dm.pl locations ==="
          find "$THEOS" -type f -name "dm.pl" -print

          echo "=== dm.pl references in Theos makefiles ==="
          grep -R "dm.pl" "$THEOS/makefiles" | head -30 || true

          echo "=== PATH dm.pl ==="
          command -v dm.pl || true

          cd LinguaTweakPrefs

          make package \
            ARCHS=arm64e \
            FINALPACKAGE=1

      - name: Find deb
        run: |
          find . -name "*.deb" -print

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e
          path: |
            packages/*.deb
            .theos/packages/*.deb
          if-no-files-found: error
