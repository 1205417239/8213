name: Build LinguaTweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: |
          brew install ldid || true

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install SDK
        run: |
          mkdir -p "$HOME/theos/sdks"

          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          fi

          ls "$HOME/theos/sdks"

      - name: Build arm64e package
        run: |
          export THEOS="$HOME/theos"
          export PATH="/opt/homebrew/bin:$PATH"

          make clean

          make package \
            ARCHS=arm64e \
            FINALPACKAGE=1

      - name: Check package
        run: |
          find . -name "*.deb" -print

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e-deb
          path: |
            packages/*.deb
            .theos/packages/*.deb
          if-no-files-found: error
