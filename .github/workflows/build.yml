name: Build LinguaTweak

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iPhoneOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          export PATH="/opt/homebrew/bin:$PATH"
          make clean
          make package FINALPACKAGE=1

      - name: Verify package
        run: |
          echo "=== Build products ==="
          find . -name "*.deb" -print

          echo "=== Mach-O architecture ==="
          file .theos/obj/arm64e/*.dylib 2>/dev/null || true
          file .theos/obj/arm64e/* 2>/dev/null || true

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e
          path: |
            packages/*.deb
            .theos/packages/*.deb
          if-no-files-found: error
