name: Build LinguaTweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build arm64e
        run: |
          export THEOS="$HOME/theos"
          export THEOS_MAKE_PATH="$HOME/theos/makefiles"
          export PATH="$HOME/theos/bin:/opt/homebrew/bin:$PATH"

          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"

          ls "$THEOS_MAKE_PATH/tweak.mk"
          ls "$THEOS_MAKE_PATH/aggregate.mk"

          cd LinguaTweakPrefs

          make package \
            ARCHS=arm64e \
            FINALPACKAGE=1

      - name: Find deb
        run: |
          find . -name "*.deb" -print

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LinguaTweak-arm64e
          path: |
            packages/*.deb
            .theos/packages/*.deb
          if-no-files-found: error
