name: Check Theos

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf "$HOME/theos"

          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Diagnose Theos
        run: |
          export THEOS="$HOME/theos"

          echo "THEOS=$THEOS"

          echo "=== find dm.pl ==="
          find "$THEOS" -name "dm.pl" -print

          echo "=== find makefiles ==="
          find "$THEOS" -name "makefiles" -type d -print

          echo "=== list bin ==="
          ls -la "$THEOS/bin" || true

          echo "=== env ==="
          env | grep THEOS || true
